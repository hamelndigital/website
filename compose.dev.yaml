# Development — Bun dev server with the repo mounted for hot reload.
# Only port 3000 is published for local access; no Traefik.
name: hamelndigital-website-dev

services:
  dev:
    image: oven/bun:1.4.2
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules

volumes:
  dev-node-modules:
